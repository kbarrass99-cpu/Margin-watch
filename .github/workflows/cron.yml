name: Price & Stock Check

on:
  schedule:
    # Runs every 6 hours. Change the "*/6" to "*/12" for every 12 hours,
    # or "0 8 * * *" to run once a day at 8am UTC.
    - cron: '0 */6 * * *'
  workflow_dispatch: {}
    # ^ this lets you click "Run workflow" in the GitHub Actions tab
    #   to trigger a check manually, useful for testing.

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger MarginWatch check-all endpoint
        run: |
          curl -sS -X POST "${{ secrets.APP_URL }}/api/cron/check-all" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            --fail-with-body
